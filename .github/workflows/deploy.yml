name: Deploy to VPS Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            TARGET_DIR="${{ secrets.SERVER_PATH || '/var/www/extensiacreativebali' }}"
            echo "📁 Menuju ke folder proyek: $TARGET_DIR"
            cd "$TARGET_DIR"

            echo "📥 Mengambil commit terbaru dari branch main..."
            git pull origin main

            echo "📦 Menginstall dependencies (termasuk Tailwind)..."
            npm install

            echo "⚡ Meng-compile Tailwind CSS..."
            npm run build

            echo "🎉 Deployment ke VPS berhasil diselesaikan!"
